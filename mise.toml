[tools]
node = "26"
pnpm = "12.18.0"
hk = "2.12.0"
jactionlint = "2.5.0"
shellcheck = "0.11.0"
betterleaks = "1.10.0"
osv-scanner = "2.7.1"
typos = "1.52.1"
gh = "latest"

[env]
_.path = ["./node_modules/.bin"]

[tasks.setup]
run = "pnpm install --frozen-lockfile && hk install --mise"

[tasks.dev]
alias = "default"
run = "pnpm dev"

# Production build: client bundle and server output in dist/.
[tasks.build]
run = "pnpm build"

# Serve the built app. NODE_ENV is set for the task process only.
[tasks.start]
run = "pnpm start"
env = { NODE_ENV = "production" }

# Full CI gate: whole project, including the network vulnerability scan.
[tasks.check]
depends = ["check:push", "audit"]

# Whole-project checks that do not need the OSV database.
[tasks."check:push"]
depends = [
  "format",
  "lint",
  "typecheck",
  "test",
  "gen:check",
  "knip",
  "jactionlint",
  "typos",
  "secrets",
  "agent-config",
]

# Fast checks for the files hk passes from the Git index.
[tasks."check:staged"]
run = '''
#!/usr/bin/env bash
set -e
if [ "${1:-}" = "--" ]; then shift; fi
[ "$#" -gt 0 ] || exit 0

oxfmt --check --no-error-on-unmatched-pattern "$@"
oxlint --deny-warnings --no-error-on-unmatched-pattern "$@"
typos --force-exclude --diff "$@"
betterleaks dir --redact --verbose --no-banner "$@"
agnix --strict .
'''

# Safe autofixes, run sequentially so two fixers never write the same file.
[tasks.fix]
run = '''
#!/usr/bin/env bash
set -e
oxfmt --write .
oxlint --deny-warnings --fix .
typos --force-exclude --write-changes .
'''

[tasks."fix:staged"]
run = '''
#!/usr/bin/env bash
set -e
if [ "${1:-}" = "--" ]; then shift; fi
[ "$#" -gt 0 ] || exit 0

oxfmt --write --no-error-on-unmatched-pattern "$@"
oxlint --deny-warnings --fix --no-error-on-unmatched-pattern "$@"
typos --force-exclude --write-changes "$@"
mise run check:staged -- "$@"
'''

# Scheduled CI job: scan the full Git history for secrets.
[tasks.security]
depends = ["secrets:history"]

# API tests. Part of `check:push`, so CI and pre-push run them too.
[tasks.test]
run = "pnpm test"

# Regenerate the API contract and fail if the committed artifacts are stale.
[tasks."gen:check"]
run = '''
#!/usr/bin/env bash
set -e
pnpm gen
git diff --exit-code -- packages/api/generated
'''

[tasks.format]
run = "oxfmt --check ."

[tasks."format:fix"]
alias = "format-fix"
run = "oxfmt --write ."

[tasks.lint]
run = "oxlint --deny-warnings ."

[tasks."lint:fix"]
alias = "lint-fix"
run = "oxlint --deny-warnings --fix ."

[tasks.typos]
run = "typos --force-exclude ."

[tasks."typos:fix"]
alias = "typos-fix"
run = "typos --force-exclude --write-changes ."

[tasks.secrets]
run = "betterleaks dir . --redact --verbose --no-banner"

[tasks."secrets:history"]
run = "betterleaks git . --redact --verbose --no-banner"

[tasks."agent-config"]
run = "agnix --strict ."

[tasks.audit]
run = "osv-scanner scan source --allow-no-lockfiles pnpm-lock.yaml"

[tasks.typecheck]
run = "pnpm typecheck"

[tasks.knip]
run = "knip --no-progress"

[tasks.jactionlint]
run = "jactionlint --no-color"

# Build the production Docker image (see Dockerfile).
[tasks."docker:build"]
run = "docker build -t calls-calendar ."

# Run the built image. PORT is the host port, the container listens on 3000.
[tasks."docker:run"]
run = "docker run --rm -p \"${PORT:-3000}:3000\" calls-calendar"
