packages:
  - packages/*
overrides:
  js-yaml: ^4.3.2
  # drizzle-kit затягивает @esbuild-kit/esm-loader, а тот — esbuild 0.18.20
  # с GHSA-67mh-4wv8-2f99. Версия из тулинга drizzle-kit (0.25.12) API-совместима,
  # а скан osv не пропускает уязвимую транзитивную зависимость.
  esbuild@0.18.20: 0.25.12
allowBuilds:
  agnix: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@typespec/compiler@1.18.0'
  - '@typespec/http@1.18.0'
  - '@typespec/openapi3@1.18.0'
  - '@typespec/openapi@1.18.0'
