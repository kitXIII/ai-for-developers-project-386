# `pn` is pnpm's real short binary name, used by the tasks in mise.toml.
[default.extend-words]
pn = "pn"

# Generated API artifacts: TypeSpec → OpenAPI output and the hey-api SDK.
# Vendored agent skills: third-party files, not subject to repo spelling rules.
[files]
extend-exclude = [".agents", "packages/api/generated"]
