version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /packages/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - '*'
    # TypeScript 6 is pinned on purpose: hey-api (openapi-ts) does not support TS 7 native yet.
    # See AGENTS.md, «API-контракт». Do not remove this ignore when bumping TypeScript.
    ignore:
      - dependency-name: typescript
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
