# Render Blueprint: Docker-сервис kit-calls (free, singapore). Источник правды по инфраструктуре.
services:
  - type: web
    name: kit-calls
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      # Internal URL: сервис и БД в одном регионе. Схему мигрируем вручную
      # (docs/adr/0008), поэтому переменная появляется после первой миграции.
      - key: DATABASE_URL
        fromDatabase:
          name: kit-calls-db
          property: connectionString

# Postgres для pg-адаптеров (#74). Миграции применяются вручную до появления
# DATABASE_URL у сервиса (docs/adr/0008, docs/adr/0009).
databases:
  - name: kit-calls-db
    plan: free
    region: singapore
    postgresMajorVersion: '17'
    databaseName: kit_calls
    user: kit_calls
