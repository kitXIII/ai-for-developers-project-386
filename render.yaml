# Render Blueprint: Docker-сервис kit-calls (free, singapore). Источник правды по инфраструктуре.
services:
  - type: web
    name: kit-calls
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: checksPass
    # Entrypoint деплоя (docs/adr/0010): миграции из migrations/ применяются
    # на каждом старте до приложения. Падение миграции останавливает запуск.
    dockerCommand: sh -c 'node dist/migrate.js && node dist/index.js'
    envVars:
      # Internal URL: сервис и БД в одном регионе. Переменная есть с первого
      # деплоя: схему приводит в порядок entrypoint до старта приложения.
      - key: DATABASE_URL
        fromDatabase:
          name: kit-calls-db
          property: connectionString

# Postgres для pg-адаптеров (#74). Схему применяет entrypoint сервиса
# (docs/adr/0010), ручной `mise run db:migrate` остаётся для локальной БД.
databases:
  - name: kit-calls-db
    plan: free
    region: singapore
    postgresMajorVersion: '17'
    databaseName: kit_calls
    user: kit_calls
